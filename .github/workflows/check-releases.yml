name: Check Claude Code Releases

on:
  schedule:
    - cron: '0 1 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Check and notify
        id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python << 'PYEOF'
          import requests
          import json
          import os
          from datetime import datetime, timedelta, timezone

          # 直近のリリースを最大20件取得
          resp = requests.get(
              "https://api.github.com/repos/anthropics/claude-code/releases",
              params={"per_page": 20}
          )
          all_releases = resp.json()

          # 前回チェックしたバージョンを確認
          last_tag = ""
          if os.path.exists("last_checked_version.txt"):
              with open("last_checked_version.txt") as f:
                  last_tag = f.read().strip()

          print(f"Last checked: {last_tag}")

          # 直近7日間の新リリースを抽出
          one_week_ago = datetime.now(timezone.utc) - timedelta(days=7)
          new_releases = []

          for rel in all_releases:
              tag = rel.get("tag_name", "")
              published_str = rel.get("published_at", "")
              if not published_str:
                  continue
              published_dt = datetime.fromisoformat(published_str.replace("Z", "+00:00"))

              # 前回チェック済みのバージョンに到達したら終了
              if tag == last_tag:
                  break
              # 7日以内のリリースのみ
              if published_dt >= one_week_ago:
                  new_releases.append(rel)

          latest_tag = all_releases[0].get("tag_name", "unknown") if all_releases else "unknown"
          print(f"Latest release: {latest_tag}")
          print(f"New releases in past 7 days: {len(new_releases)}")

          webhook_url = os.environ.get("SLACK_WEBHOOK_URL")

          # 新しいリリースがない場合
          if not new_releases:
              print(f"No new releases (current: {latest_tag})")

              if webhook_url:
                  slack_message = {
                      "channel": "#004_claude-code",
                      "username": "Claude Code Release Bot",
                      "icon_emoji": ":mailbox_with_no_mail:",
                      "blocks": [
                          {
                              "type": "section",
                              "text": {
                                  "type": "mrkdwn",
                                  "text": f":mailbox_with_no_mail: 今週のClaude Code更新はありませんでした\n（現在: {latest_tag}）"
                              }
                          }
                      ]
                  }
                  requests.post(webhook_url, json=slack_message)
                  print("Sent 'no update' notification")

              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("new_release=false\n")
              exit(0)

          # 新リリースあり
          print(f"New releases detected: {[r['tag_name'] for r in new_releases]}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("new_release=true\n")
              f.write(f"tag={latest_tag}\n")

          # 全リリースノートを結合
          combined_notes = ""
          release_list_text = ""
          for rel in reversed(new_releases):  # 古い順
              tag = rel.get("tag_name", "")
              body = rel.get("body", "No release notes")
              published = rel.get("published_at", "")[:10]
              url = rel.get("html_url", "")
              combined_notes += f"\n\n--- {tag} ({published}) ---\n{body}"
              release_list_text += f"• <{url}|{tag}> ({published})\n"

          # Claude Haiku 4.5で日本語要約
          api_key = os.environ.get("ANTHROPIC_API_KEY")
          summary_ja = "（要約を取得できませんでした）"

          if api_key:
              try:
                  prompt = f"""あなたはClaude Codeの週次アップデートレポーターです。
          以下は直近1週間にリリースされた{len(new_releases)}バージョン分のリリースノートです。

          ## 要約ルール
          1. 1週間の「最終的な成果」だけを抽出すること。途中バージョンで入ったバグとその修正は相殺して省略。
             例: v2.1.45で機能Aを追加 → v2.1.46で機能Aのバグ修正 → 「機能Aが追加された」とだけ書く
          2. ユーザーにとって実際に影響がある変更に絞る（内部リファクタリングは省略可）
          3. 各項目は1行で簡潔に。補足が必要なら括弧書きで短く
          4. 日本語で書く

          ## 出力形式（Slack mrkdwn記法）
          *:sparkles: 新機能*
          • xxx
          • xxx

          *:chart_with_upwards_trend: 改善*
          • xxx

          *:warning: 破壊的変更・注意点*
          • xxx（あれば。なければこのセクション省略）

          *:bulb: 一言まとめ*
          今週は○○が中心のアップデート。特に△△は要チェック。

          ## リリースノート（古い順）
          {combined_notes[:6000]}"""

                  resp = requests.post(
                      "https://api.anthropic.com/v1/messages",
                      headers={
                          "Content-Type": "application/json",
                          "x-api-key": api_key,
                          "anthropic-version": "2023-06-01"
                      },
                      json={
                          "model": "claude-haiku-4-5-20251001",
                          "max_tokens": 2048,
                          "messages": [{"role": "user", "content": prompt}]
                      }
                  )
                  result = resp.json()
                  if "content" in result and len(result["content"]) > 0:
                      summary_ja = result["content"][0]["text"]
                      print("Summary generated successfully")
                  else:
                      print(f"API response: {result}")
              except Exception as e:
                  print(f"Error calling Claude API: {e}")

          # Slack通知（週次まとめ）
          if webhook_url:
              count = len(new_releases)
              oldest_tag = new_releases[-1]["tag_name"]
              header_text = f":rocket: Claude Code 週次まとめ ({oldest_tag} → {latest_tag})"

              blocks = [
                  {
                      "type": "header",
                      "text": {
                          "type": "plain_text",
                          "text": header_text,
                          "emoji": True
                      }
                  },
                  {
                      "type": "context",
                      "elements": [
                          {
                              "type": "mrkdwn",
                              "text": f"対象: {count}バージョン | {release_list_text.strip()}"
                          }
                      ]
                  },
                  {"type": "divider"},
                  {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": summary_ja[:2900]
                      }
                  }
              ]

              slack_message = {
                  "channel": "#004_claude-code",
                  "username": "Claude Code Release Bot",
                  "icon_emoji": ":rocket:",
                  "blocks": blocks
              }

              resp = requests.post(webhook_url, json=slack_message)
              print(f"Slack notification sent: {resp.status_code}")

          # 最新バージョンを保存
          with open("last_checked_version.txt", "w") as f:
              f.write(latest_tag)
          print(f"Saved version: {latest_tag}")
          PYEOF

      - name: Commit version file
        if: steps.check.outputs.new_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_checked_version.txt
          git commit -m "chore: update last checked version to ${{ steps.check.outputs.tag }}" || echo "No changes to commit"
          git push
