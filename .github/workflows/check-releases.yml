name: Check Claude Code Releases

on:
  schedule:
    - cron: '0 1 * * 6'
  workflow_dispatch:

jobs:
  check-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Check and notify
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python << 'PYEOF'
          import requests
          import json
          import os

          # 最新リリース取得
          resp = requests.get("https://api.github.com/repos/anthropics/claude-code/releases/latest")
          release = resp.json()
          
          tag = release.get("tag_name", "unknown")
          url = release.get("html_url", "")
          published = release.get("published_at", "")
          body = release.get("body", "No release notes")
          
          print(f"Latest release: {tag}")
          
          # 前回のバージョンを確認
          last_tag = ""
          if os.path.exists("last_checked_version.txt"):
              with open("last_checked_version.txt") as f:
                  last_tag = f.read().strip()
          
          webhook_url = os.environ.get("SLACK_WEBHOOK_URL")
          
          # 新しいリリースがない場合
          if tag == last_tag or tag == "unknown":
              print(f"No new release (current: {tag})")
              
              # 更新なし通知をSlackに送信
              if webhook_url:
                  slack_message = {
                      "channel": "#004_claude-code",
                      "username": "Claude Code Release Bot",
                      "icon_emoji": ":mailbox_with_no_mail:",
                      "blocks": [
                          {
                              "type": "section",
                              "text": {
                                  "type": "mrkdwn",
                                  "text": f"📭 今週のClaude Code更新はありませんでした\n（現在: {tag}）"
                              }
                          }
                      ]
                  }
                  requests.post(webhook_url, json=slack_message)
                  print("Sent 'no update' notification")
              exit(0)
          
          print(f"New release detected: {tag}")
          
          # Claude Haikuで日本語要約
          api_key = os.environ.get("ANTHROPIC_API_KEY")
          summary_ja = "（要約を取得できませんでした）"
          
          if api_key:
              try:
                  prompt = f"""以下はClaude Code {tag}のリリースノートです。日本語で簡潔に要約してください。

          重要なポイント:
          - 新機能は何か
          - 改善点は何か
          - 特にMCP、Tool Search、トークン削減に関する内容があれば強調

          出力形式:
          📦 主な新機能:
          • xxx

          🔧 改善・修正:
          • xxx

          ⭐ 注目ポイント:
          • xxx（あれば）

          リリースノート:
          {body[:3000]}"""
                  
                  resp = requests.post(
                      "https://api.anthropic.com/v1/messages",
                      headers={
                          "Content-Type": "application/json",
                          "x-api-key": api_key,
                          "anthropic-version": "2023-06-01"
                      },
                      json={
                          "model": "claude-3-5-haiku-20241022",
                          "max_tokens": 1024,
                          "messages": [{"role": "user", "content": prompt}]
                      }
                  )
                  result = resp.json()
                  if "content" in result and len(result["content"]) > 0:
                      summary_ja = result["content"][0]["text"]
                      print("Summary generated successfully")
                  else:
                      print(f"API response: {result}")
              except Exception as e:
                  print(f"Error calling Claude API: {e}")
          
          # Slack通知（新リリースあり）
          if webhook_url:
              slack_message = {
                  "channel": "#004_claude-code",
                  "username": "Claude Code Release Bot",
                  "icon_emoji": ":rocket:",
                  "blocks": [
                      {
                          "type": "header",
                          "text": {
                              "type": "plain_text",
                              "text": f"🚀 Claude Code {tag} がリリースされました！",
                              "emoji": True
                          }
                      },
                      {
                          "type": "section",
                          "text": {
                              "type": "mrkdwn",
                              "text": f"*リリース日時:* {published}\n*詳細:* <{url}|GitHub Release Page>"
                          }
                      },
                      {"type": "divider"},
                      {
                          "type": "section",
                          "text": {
                              "type": "mrkdwn",
                              "text": summary_ja[:2900]
                          }
                      }
                  ]
              }
              
              resp = requests.post(webhook_url, json=slack_message)
              print(f"Slack notification sent: {resp.status_code}")
          
          # バージョン保存
          with open("last_checked_version.txt", "w") as f:
              f.write(tag)
          print(f"Saved version: {tag}")
          PYEOF

      - name: Commit version file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_checked_version.txt || true
          git diff --staged --quiet || git commit -m "chore: update last checked version"
          git push || true
